# Declarative metadata for the TxAgent external agent.
# See INTEGRATING.md at the repo root for the full schema.

id: txagent
name: TxAgent
version: 0.1.0
description: >
  Wraps TxAgent (Gao et al., Harvard MIMS), a therapeutic-reasoning agent
  that answers precision-medicine questions (drug interactions,
  contraindications, dose adjustment for organ impairment) by multi-step
  tool use over the ToolUniverse of ~200 biomedical tools. Given a
  natural-language clinical/therapeutic question, it returns an
  evidence-grounded recommendation.

  OPERATIONAL NOTE: TxAgent serves a fine-tuned 8B model in-process via
  vLLM and REQUIRES a CUDA GPU (the authors recommend an H100/80GB) plus a
  multi-GB HuggingFace weight download. On a machine without a suitable GPU
  the tool returns a structured "requires_gpu"/"unavailable" status rather
  than a fabricated answer — it never invents clinical guidance.

upstream:
  repo: https://github.com/mims-harvard/TxAgent.git
  # Pinned commit — bump this and re-test when upgrading.
  commit: 8c24ad9ee2aeb6ca541f63c797d57d7e68502aa4
  submodule_path: upstream

# TxAgent uses its OWN fine-tuned model (not an API model), pinned for
# reproducibility against the published results. The weights are pulled
# from HuggingFace by vLLM at first run; no chat-provider API key is used.
# HF_TOKEN may be required if the model repo is gated.
llm:
  pinned_model: mims-harvard/TxAgent-T1-Llama-3.1-8B
  rag_model: mims-harvard/ToolRAG-T1-GTE-Qwen2-1.5B
  required_env_vars: []          # HF_TOKEN only if the HF repo is gated

# Per-invocation artifacts go under <project>/outputs/txagent/<request_id>/.
data_subdir: txagent

# The single StructuredTool the manager sees.
tool:
  name: txagent_answer_question_tool
  description: >
    Answers a therapeutic / precision-medicine question with TxAgent's
    multi-step tool-use reasoning. Requires a CUDA GPU + model weights;
    returns a structured status (ok / requires_gpu / unavailable) and, when
    runnable, the final recommendation plus the captured reasoning trace.
