template_id: CELL_ANNOTATION
title: Reference-based cell-type transfer
task: Transfer cell-type labels from a provided or explicitly requested reference dataset
version: "1.0"
last_updated: 2025-11-11
tags: [cell type annotation, label transfer, harmony, reference, scRNA-seq, spatial]

inputs:
  - spatial AnnData(.h5ad) file path
  - reference AnnData(.h5ad) file path or explicit request to acquire a reference

outputs:
  - updated spatial AnnData(.h5ad) file with cell type column in .obs
  - no other expected artifiacts, only the updated anndata file for the spatial dataset
step_sketch: >
  use a provided or explicitly requested reference dataset → use Harmony transfer
  to infer cell types in spatial dataset
