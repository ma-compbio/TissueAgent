schema_version: "1.0"
dataset_id: bcl
title: Primary central nervous system diffuse large B-cell lymphoma
species: human
tissue: central nervous system
disease: primary central nervous system diffuse large B-cell lymphoma
developmental_stage: adult
study_context: >-
  The dataset contains 5-prime single-cell RNA sequencing from dissociated surgical biopsies.
  The study focuses on the lymphoma tumor and tumor-immune microenvironment. This is an immune-
  and tumor-focused cohort, not a representative whole-brain atlas; CNS-resident cells may
  nevertheless be present.
annotation_scope:
  primary_scope: lymphoma tumor and tumor-immune microenvironment
  secondary_scope: CNS-resident populations may be present
  sampling_context: dissociated surgical biopsies; not a representative whole-brain atlas
  requested_output: >-
    cell identity and, when supported by expression evidence, disease or malignancy state
source:
